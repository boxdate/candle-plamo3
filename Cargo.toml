[package]
name = "candle-plamo3"
version = "0.1.0"
edition = "2021"
description = "100% Pure Rust PLaMo 3 GGUF loader and tokenizer for candle"
license = "MIT OR Apache-2.0"
keywords = ["candle", "plamo3", "gguf", "llm", "translation"]
categories = ["science", "text-processing"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[features]
default = ["dialect-config"]
dialect-config = ["dep:serde", "dep:serde_json"]
